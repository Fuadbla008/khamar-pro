<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B7F4B" />
    <title>অফলাইন — খামার</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf7f2;
        color: #1a1a1a;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .card { max-width: 24rem; }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #1b7f4b;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #6b655c; line-height: 1.6; margin: 0 0 24px; }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #1b7f4b;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">খ</div>
      <h1>আপনি অফলাইন আছেন</h1>
      <p>ইন্টারনেট সংযোগ ফিরে এলে আবার চেষ্টা করুন। আপনার খামারের তথ্য নিরাপদ আছে।</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
    </div>
  </body>
</html>
